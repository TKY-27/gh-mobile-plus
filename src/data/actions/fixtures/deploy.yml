name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy
        required: true
        default: latest
      dry_run:
        description: Skip the final upload
        type: boolean
        default: true
      replicas:
        description: Number of replicas
        type: number
        default: 3
      region:
        description: Target region
        type: choice
        required: true
        options:
          - ap-northeast-1
          - us-east-1
          - eu-west-1
        default: ap-northeast-1
      target:
        description: Deployment environment
        type: environment
        default: staging
      note:
        type: text

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/deploy.sh "${{ inputs.version }}" "${{ inputs.region }}"
